name: Render Remotion Video

on:
  push:
    branches: [ main ] # سيعمل السيرفر تلقائياً كلما رفعت تعديلاً جديداً

jobs:
  build:
    runs-on: ubuntu-latest # سيرفر لينكس مجاني قوي من جيثب

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies for Remotion/Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 libxshmfence1 fonts-noto-color-emoji fonts-noto-core

    - name: Run Python Rendering Script
      run: python3 render.py

    - name: Upload Result Video
      uses: actions/upload-artifact@v4
      with:
        name: rendered-video
        path: out/video.mp4